<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https: wss: http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; img-src https: data: blob:; frame-src 'self' about: blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Open Babcord</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111318;color:#f2f4f8}*{box-sizing:border-box}html,body,#client{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#111318}#client{display:block;background:#111318}.hidden{display:none!important}.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:radial-gradient(circle at 50% 42%,rgba(124,111,242,.14),transparent 31%),#111318;text-align:center}.logo{width:58px;height:58px;display:grid;place-items:center;margin-bottom:4px;border-radius:15px;background:linear-gradient(145deg,#8f82ff,#6153cf);box-shadow:0 10px 30px rgba(105,90,218,.3);font-size:25px;font-weight:900}.screen h1{margin:0;font-size:26px;letter-spacing:-.04em}.screen p{max-width:520px;margin:0;color:#bdc3d0}.detail{color:#858e9f!important;font-size:12px}.bar{width:180px;height:3px;margin-top:10px;overflow:hidden;border-radius:99px;background:#323947}.bar span{display:block;width:42%;height:100%;border-radius:inherit;background:#9a8eff;animation:load 1.25s ease-in-out infinite}.button{min-height:40px;margin-top:7px;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 16px;background:#222731;color:#f2f4f8;cursor:pointer;font-weight:700}.button:hover{background:#292f3b}.error .logo{background:#323947;box-shadow:none;color:#858e9f}.error .bar{display:none}.notice{position:fixed;z-index:20;top:12px;left:50%;display:flex;align-items:center;gap:10px;max-width:min(680px,calc(100% - 24px));transform:translateX(-50%);border:1px solid rgba(255,196,92,.38);border-radius:11px;padding:9px 11px;background:rgba(36,31,21,.96);box-shadow:0 10px 30px rgba(0,0,0,.28);color:#ffe2aa;font-size:13px}.notice button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:18px;line-height:1}.notice span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(350%)}}@media(prefers-color-scheme:light){:root{color-scheme:light;background:#eef0f5;color:#20232c}body,#client{background:#eef0f5}.screen{background:radial-gradient(circle at 50% 42%,rgba(102,87,223,.12),transparent 31%),#f7f8fb}.screen p{color:#555d6d}.detail{color:#7a8496!important}.button{border-color:rgba(35,40,55,.16);background:#fff;color:#20232c}.bar{background:#e7e9f2}.error .logo{background:#e7e9f2;color:#7a8496}.notice{border-color:#d9a13b;background:rgba(255,248,229,.97);color:#6e4800}}
  </style>
</head>
<body>
  <iframe id="client" class="hidden" title="Babcord" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads" allow="clipboard-write"></iframe>
  <aside id="notice" class="notice hidden" role="status"><span id="notice-copy"></span><button id="dismiss-notice" type="button" aria-label="Dismiss update warning">&times;</button></aside>
  <main id="screen" class="screen" role="status" aria-live="polite">
    <div class="logo" aria-hidden="true">B</div>
    <h1 id="title">Babcord</h1>
    <p id="message">Checking GitHub for the newest client...</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <button id="retry" class="button hidden" type="button">Retry now</button>
    <p id="detail" class="detail">The server address is stored inside the verified client.</p>
  </main>
  <script>
    (() => {
      "use strict";

      const UPDATE_DESCRIPTOR_URL = "https://raw.githubusercontent.com/REPLACE_WITH_GITHUB_OWNER/REPLACE_WITH_GITHUB_REPOSITORY/main/releases/latest.json";
      const DATABASE_NAME = "babcord-portable-launcher";
      const DATABASE_VERSION = 1;
      const STORE_NAME = "verified-clients";
      const RECORD_KEY = "last-known-good";
      const LOCAL_STORAGE_KEY = "babcord.launcher.last-known-good.v1";
      const MAX_CLIENT_BYTES = 5 * 1024 * 1024;
      const REQUEST_TIMEOUT_MS = 10000;
      const GITHUB_HOSTS = new Set(["raw.githubusercontent.com", "github.com"]);
      const DESCRIPTOR_KEYS = new Set(["schemaVersion", "version", "clientUrl", "sha256", "sizeBytes", "format"]);
      const elements = {
        client: document.getElementById("client"),
        screen: document.getElementById("screen"),
        title: document.getElementById("title"),
        message: document.getElementById("message"),
        detail: document.getElementById("detail"),
        retry: document.getElementById("retry"),
        notice: document.getElementById("notice"),
        noticeCopy: document.getElementById("notice-copy")
      };
      let starting = false;

      function withTimeout(promise, milliseconds, message) {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new Error(message)), milliseconds))
        ]);
      }

      function requestSignal(milliseconds = REQUEST_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), milliseconds);
        return { controller, finish: () => clearTimeout(timer) };
      }

      function setProgress(message, detail = "") {
        elements.screen.classList.remove("error", "hidden");
        elements.retry.classList.add("hidden");
        elements.title.textContent = "Babcord";
        elements.message.textContent = message;
        elements.detail.textContent = detail || "Updates are verified before they run.";
      }

      function showFailure(error) {
        elements.screen.classList.add("error");
        elements.screen.classList.remove("hidden");
        elements.title.textContent = "Babcord could not start";
        elements.message.textContent = navigator.onLine
          ? "The newest client could not be downloaded or verified, and there is no usable saved copy yet."
          : "This device is offline, and there is no usable saved copy yet.";
        elements.detail.textContent = error?.message || "Check the GitHub launcher settings and try again.";
        elements.retry.classList.remove("hidden");
      }

      function showNotice(copy) {
        elements.noticeCopy.textContent = copy;
        elements.notice.classList.remove("hidden");
      }

      function githubUrl(value, label) {
        const parsed = new URL(String(value || ""));
        if (parsed.protocol !== "https:" || !GITHUB_HOSTS.has(parsed.hostname) || parsed.username || parsed.password) {
          throw new Error(`${label} must be an HTTPS GitHub URL.`);
        }
        return parsed.toString();
      }

      function validateDescriptor(value) {
        if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("The GitHub update descriptor is not a JSON object.");
        const keys = Object.keys(value);
        if (keys.length !== DESCRIPTOR_KEYS.size || keys.some((key) => !DESCRIPTOR_KEYS.has(key))) throw new Error("The GitHub update descriptor has an unsupported schema.");
        if (value.schemaVersion !== 1 || value.format !== "babcord-single-html-v1") throw new Error("The GitHub client format is not supported by this launcher.");
        if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(String(value.version || ""))) throw new Error("The client version in GitHub is invalid.");
        if (!/^[a-f0-9]{64}$/i.test(String(value.sha256 || ""))) throw new Error("The client SHA-256 in GitHub is invalid.");
        if (!Number.isSafeInteger(value.sizeBytes) || value.sizeBytes < 1 || value.sizeBytes > MAX_CLIENT_BYTES) throw new Error("The client size in GitHub is invalid.");
        const normalizedHash = String(value.sha256).toLowerCase();
        const normalizedClientUrl = githubUrl(value.clientUrl, "The client URL");
        if (!new URL(normalizedClientUrl).pathname.endsWith(`/clients/${normalizedHash}.html`)) {
          throw new Error("The GitHub client URL is not content-addressed by its SHA-256.");
        }
        return {
          schemaVersion: 1,
          version: String(value.version),
          clientUrl: normalizedClientUrl,
          sha256: normalizedHash,
          sizeBytes: value.sizeBytes,
          format: value.format
        };
      }

      async function sha256(bytes) {
        if (!globalThis.crypto?.subtle) throw new Error("This Chrome version cannot verify Babcord updates.");
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
      }

      function clientVersion(html) {
        const match = html.match(/<meta\s+name=["']babcord-client-version["']\s+content=["']([^"']+)["']/i);
        return match?.[1] || "";
      }

      async function verifiedRecord(record, expected = null) {
        if (!record || typeof record.html !== "string" || !/^[a-f0-9]{64}$/i.test(String(record.sha256 || ""))) return null;
        if (record.html.length > MAX_CLIENT_BYTES || !/^\s*<!doctype html>/i.test(record.html)) return null;
        const bytes = new TextEncoder().encode(record.html);
        if (bytes.byteLength > MAX_CLIENT_BYTES) return null;
        const actualHash = await sha256(bytes);
        if (actualHash !== String(record.sha256).toLowerCase()) return null;
        if (clientVersion(record.html) !== String(record.version || "")) return null;
        if (expected && (actualHash !== expected.sha256 || String(record.version) !== expected.version)) return null;
        return { ...record, sha256: actualHash };
      }

      function openDatabase() {
        return withTimeout(new Promise((resolve, reject) => {
          if (!globalThis.indexedDB) return reject(new Error("IndexedDB is unavailable."));
          const request = indexedDB.open(DATABASE_NAME, DATABASE_VERSION);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME);
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("IndexedDB could not open."));
          request.onblocked = () => reject(new Error("IndexedDB is blocked."));
        }), 3000, "IndexedDB took too long to open.");
      }

      async function readIndexedRecord() {
        const database = await openDatabase();
        try {
          return await withTimeout(new Promise((resolve, reject) => {
            const request = database.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get(RECORD_KEY);
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error || new Error("IndexedDB read failed."));
          }), 3000, "IndexedDB read took too long.");
        } finally {
          database.close();
        }
      }

      async function writeIndexedRecord(record) {
        const database = await openDatabase();
        try {
          await withTimeout(new Promise((resolve, reject) => {
            const transaction = database.transaction(STORE_NAME, "readwrite");
            transaction.objectStore(STORE_NAME).put(record, RECORD_KEY);
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error || new Error("IndexedDB write failed."));
            transaction.onabort = () => reject(transaction.error || new Error("IndexedDB write was aborted."));
          }), 3000, "IndexedDB write took too long.");
        } finally {
          database.close();
        }
      }

      function readLocalRecord() {
        const value = localStorage.getItem(LOCAL_STORAGE_KEY);
        return value ? JSON.parse(value) : null;
      }

      function writeLocalRecord(record) {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(record));
      }

      async function loadCachedRecord(expected = null) {
        const readers = [readIndexedRecord, async () => readLocalRecord()];
        for (const reader of readers) {
          try {
            const verified = await verifiedRecord(await reader(), expected);
            if (verified) return verified;
          } catch {
            // Try the next storage method. Hardened Chrome profiles can disable either one.
          }
        }
        return null;
      }

      async function saveCachedRecord(record) {
        const results = await Promise.allSettled([writeIndexedRecord(record), Promise.resolve().then(() => writeLocalRecord(record))]);
        if (results.every((result) => result.status === "rejected")) throw new Error("Chrome could not save the verified Babcord client.");
      }

      async function fetchDescriptor() {
        const descriptorUrl = githubUrl(UPDATE_DESCRIPTOR_URL, "The launcher update URL");
        const request = requestSignal();
        try {
          const response = await fetch(descriptorUrl, { cache: "no-store", redirect: "follow", signal: request.controller.signal, headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error(`GitHub returned ${response.status} for the update descriptor.`);
          return validateDescriptor(await response.json());
        } finally {
          request.finish();
        }
      }

      async function downloadClient(descriptor) {
        const request = requestSignal(20000);
        try {
          const response = await fetch(descriptor.clientUrl, { cache: "no-store", redirect: "follow", signal: request.controller.signal, headers: { Accept: "text/html" } });
          if (!response.ok) throw new Error(`GitHub returned ${response.status} for the Babcord client.`);
          const declaredLength = Number(response.headers.get("content-length") || 0);
          if (declaredLength > MAX_CLIENT_BYTES) throw new Error("The Babcord client download is unexpectedly large.");
          const bytes = await response.arrayBuffer();
          if (bytes.byteLength > MAX_CLIENT_BYTES || bytes.byteLength !== descriptor.sizeBytes) throw new Error("The Babcord client download has an unexpected size.");
          const actualHash = await sha256(bytes);
          if (actualHash !== descriptor.sha256) throw new Error("The downloaded client failed SHA-256 verification.");
          const html = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
          if (!/^\s*<!doctype html>/i.test(html) || clientVersion(html) !== descriptor.version) {
            throw new Error("The downloaded file is not the expected Babcord client version.");
          }
          return { html, version: descriptor.version, sha256: actualHash };
        } finally {
          request.finish();
        }
      }

      function runClient(record, warning = "") {
        elements.client.addEventListener("load", () => {
          elements.screen.classList.add("hidden");
          elements.client.classList.remove("hidden");
          if (warning) showNotice(warning);
        }, { once: true });
        elements.client.srcdoc = record.html;
      }

      async function start() {
        if (starting) return;
        starting = true;
        elements.notice.classList.add("hidden");
        elements.client.classList.add("hidden");
        setProgress("Checking GitHub for the newest client...", "The server address is stored inside the verified client.");

        let anyCached = null;
        try { anyCached = await loadCachedRecord(); } catch { /* A fresh GitHub copy can still start. */ }

        try {
          const descriptor = await fetchDescriptor();
          const exactCached = anyCached?.sha256 === descriptor.sha256 && anyCached?.version === descriptor.version
            ? await verifiedRecord(anyCached, descriptor)
            : await loadCachedRecord(descriptor);
          if (exactCached) {
            runClient(exactCached);
            return;
          }

          setProgress("Downloading a verified Babcord update...", `Client ${descriptor.version} - SHA-256 protected`);
          const downloaded = await downloadClient(descriptor);
          try {
            await saveCachedRecord(downloaded);
            runClient(downloaded);
          } catch {
            runClient(downloaded, "The verified client is running, but Chrome could not save it for offline fallback.");
          }
        } catch (error) {
          const fallback = anyCached || await loadCachedRecord();
          if (fallback) {
            runClient(fallback, "The GitHub update could not be downloaded or verified. Running the last verified Babcord client saved on this device.");
          } else {
            showFailure(error);
          }
        } finally {
          starting = false;
        }
      }

      elements.retry.addEventListener("click", start);
      document.getElementById("dismiss-notice").addEventListener("click", () => elements.notice.classList.add("hidden"));
      window.addEventListener("online", () => { if (!elements.screen.classList.contains("hidden")) start(); });
      start();
    })();
  </script>
</body>
</html>
